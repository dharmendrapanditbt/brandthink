# Deploys thebrandthink.com on every push to master.
# The work happens on the server in /home/brandthink/deploy.sh: it builds in a
# separate folder and only switches the live site if the build succeeds.
# The deploy SSH key can only run that script (forced command on the server).
name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30 \
            "brandthink@$DEPLOY_HOST" deploy
